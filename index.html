<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#0b0b0c"><meta name="apple-mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<link rel="manifest" href="manifest.webmanifest"><link rel="apple-touch-icon" href="icon-192.png"><link rel="stylesheet" href="style.css">
<title>mcwallet</title></head>
<body>
<div id="auth" class="auth-wrap">
  <div class="auth-brand"><span class="logo">◇</span><span>mcwallet</span></div>
  <div class="auth-card">
    <div class="eyebrow">SIGNATURE EXPERIENCE</div>
    <h1 id="authTitle">Создать аккаунт</h1>
    <p class="muted" id="authSubtitle">Ваше личное финансовое пространство</p>
    <form id="authForm">
      <label id="nameLabel">Имя в профиле</label><input id="name" autocomplete="nickname" placeholder="Например, Alex" maxlength="24">
      <label>Логин</label><input id="username" autocomplete="username" placeholder="Придумайте логин" required minlength="3" maxlength="24">
      <label>Демо-пароль</label><input id="password" type="password" autocomplete="new-password" placeholder="Придумайте пароль" required minlength="4">
      <button class="primary wide" id="authSubmit">Создать демо-аккаунт</button>
    </form>
    <p class="auth-switch" id="authSwitch">Уже есть аккаунт? <button type="button" class="link" id="switchAuth">Войти</button></p>
    <p class="tiny-note">Только локальная демонстрация. Не используйте настоящие пароли или личные данные. Демо-профиль хранится на этом устройстве.</p>
  </div>
</div>

<div id="app" class="app hidden">
<header class="topbar"><div class="brand"><span class="logo">◇</span><span>mcwallet</span></div><button class="avatar" id="profileShortcut">M</button></header>
<main id="screen"></main>
<nav class="bottom-nav">
<button data-page="home" class="selected"><span>⌂</span>Главная</button>
<button data-page="cards"><span>▣</span>Карты</button>
<button data-page="wallets"><span>◈</span>Кошельки</button>
<button data-page="activity"><span>▤</span>Операции</button>
<button data-page="profile"><span>◯</span>Профиль</button>
</nav>
</div>
<div class="toast" id="toast"></div>
<script src="app.js"></script>
</body></html>
